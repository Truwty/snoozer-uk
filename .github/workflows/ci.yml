name: CI

on:
  pull_request:
  push:
    # Feature branches are validated by pull_request; only run post-merge CI on main.
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full: ${{ steps.decision.outputs.run_full }}
    steps:
      - name: Skip only when the merged PR already passed the required CI check
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_full=true

          if [[ "$EVENT_NAME" == "push" ]]; then
            associated_prs="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls")"
            merged_pr="$(jq -c 'first(.[] | select(.merged_at != null)) // empty' <<<"$associated_prs")"

            if [[ -n "$merged_pr" ]]; then
              pr_number="$(jq -r '.number' <<<"$merged_pr")"
              pr_head="$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/$REPOSITORY/pulls/$pr_number" --jq '.head.sha')"
              checks="$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/$REPOSITORY/commits/$pr_head/check-runs")"

              if jq -e 'any(.check_runs[]; .name == "validate" and .conclusion == "success")' \
                <<<"$checks" >/dev/null; then
                run_full=false
                echo "PR #$pr_number already passed the aggregate validate check on $pr_head."
                echo "Skipping only the redundant post-merge full test suite."
              else
                echo "PR #$pr_number has no successful aggregate validate check; full CI will run."
              fi
            fi
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  quality:
    name: Security and quality checks
    needs: prepare
    if: needs.prepare.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Scan source for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner --verbose

      - name: Run dependency and policy audit
        run: npm run audit

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run unit and database tests
        run: npm test

  verify:
    name: Browser tests (shard ${{ matrix.shard }}/5)
    needs: prepare
    if: needs.prepare.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SNOOZER_TEST_LIGHTHOUSE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Start disposable Supabase in the background
        shell: bash
        run: |
          set -euo pipefail

          # Isolate the project name and ports for each parallel browser shard.
          shard="${{ matrix.shard }}"
          export SUPABASE_CI_SHARD="$shard"
          python3 - <<'PY'
          import os
          from pathlib import Path

          shard = int(os.environ["SUPABASE_CI_SHARD"])
          run_id = int(os.environ["GITHUB_RUN_ID"])
          config = Path("supabase/config.toml")
          lines = config.read_text().splitlines()
          project_id = f"snoozer-uk-ci-{run_id}-{shard}"
          # Use per-run ports below the Linux ephemeral range to avoid host-port collisions.
          port_base = 10000 + (run_id % 100) * 60 + shard * 10
          ports = {
              "api": port_base,
              "db": port_base + 1,
              "local_smtp": port_base + 3,
          }
          section = None
          updated = set()
          for index, line in enumerate(lines):
              value = line.strip()
              if value.startswith("[") and value.endswith("]"):
                  section = value[1:-1]
              elif section in ports and value.startswith("port = "):
                  lines[index] = f"port = {ports[section]}"
                  updated.add(section)
          if updated != set(ports):
              raise SystemExit(f"Could not set Supabase shard ports: {sorted(set(ports) - updated)}")
          for index, line in enumerate(lines):
              if line.strip().startswith("project_id = "):
                  lines[index] = f'project_id = "{project_id}"'
                  break
          else:
              raise SystemExit("Could not set the isolated Supabase project ID.")
          config.write_text("\n".join(lines) + "\n")
          print(f"Supabase shard {shard}: {project_id}, {ports}")
          PY

          log="$RUNNER_TEMP/supabase-start.log"
          exit_file="$RUNNER_TEMP/supabase-start.exit"
          pid_file="$RUNNER_TEMP/supabase-start.pid"
          rm -f "$log" "$exit_file" "$pid_file"

          nohup bash -c '
            set +e
            npx --yes supabase@3.1.0 start --exclude studio,edge-runtime,logflare,vector,supavisor,postgres-meta
            result=$?
            printf "%s\n" "$result" > "$RUNNER_TEMP/supabase-start.exit"
            exit "$result"
          ' >"$log" 2>&1 </dev/null &

          echo "$!" > "$pid_file"
          echo "Supabase startup is running while the build cache is restored."
      - name: Restore Next.js build cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # actions/cache v5.0.1
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.shard }}-
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Wait for disposable Supabase and load test credentials
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat "$RUNNER_TEMP/supabase-start.pid")"
          exit_file="$RUNNER_TEMP/supabase-start.exit"
          log="$RUNNER_TEMP/supabase-start.log"

          for attempt in $(seq 1 180); do
            [[ -f "$exit_file" ]] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [[ ! -f "$exit_file" ]]; then
            echo "::error::Supabase startup did not finish within six minutes."
            tail -n 80 "$log" || true
            exit 1
          fi

          startup_status="$(cat "$exit_file")"
          if [[ "$startup_status" != "0" ]]; then
            echo "::error::The disposable Supabase stack could not start."
            python3 -c 'import pathlib,re,sys; lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines(); match=[l for l in lines if re.search(r"(?i)sqlstate|error:|failed|migration|permission denied|invalid|timeout",l)]; print("\n".join(re.sub(r"[A-Za-z0-9_.-]{120,}","[REDACTED]",l)[:350] for l in match[-20:]))' "$log"
            exit "$startup_status"
          fi

          eval "$(npx --yes supabase@3.1.0 status -o env)"
          kofi_fixture_token="$(openssl rand -hex 32)"
          stripe_fixture_secret="whsec_$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$kofi_fixture_token" "$stripe_fixture_secret"
          printf '::add-mask::%s\n' "${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          {
            printf 'NEXT_PUBLIC_SITE_URL=http://localhost:3000\n'
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "${PUBLISHABLE_KEY:-$ANON_KEY}"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            printf 'KOFI_WEBHOOK_TOKEN=%s\n' "$kofi_fixture_token"
            printf 'STRIPE_SANDBOX_WEBHOOK_SECRET=%s\n' "$stripe_fixture_secret"
            printf 'SNOOZER_TEST_LOCAL_SUPABASE=1\n'
          } >> "$GITHUB_ENV"

      - name: Build production application
        run: npm run build

      - name: Install Chromium headless shell
        run: npx playwright install --only-shell chromium

      - name: Run Playwright shard
        run: npm run test:e2e -- --workers=2 --shard=${{ matrix.shard }}/5

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-diagnostics-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: validate
    if: always()
    needs: [prepare, quality, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the combined CI result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUN_FULL: ${{ needs.prepare.outputs.run_full }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREPARE_RESULT" != "success" ]]; then
            echo "::error::CI could not determine whether full validation should run."
            exit 1
          fi
          if [[ "$RUN_FULL" == "false" ]]; then
            echo "The merged PR passed validate. Skipping duplicate post-merge CI."
            exit 0
          fi
          if [[ "$QUALITY_RESULT" != "success" ]]; then
            echo "::error::Security, static or unit checks failed or were skipped."
            exit 1
          fi
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "::error::One or more browser verification shards failed or were skipped."
            exit 1
          fi
          echo "All security, static, unit, database, build and browser checks passed."
