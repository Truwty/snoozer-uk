name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_full: ${{ steps.decision.outputs.run_full }}
    steps:
      - name: Avoid repeating CI for an already-verified PR merge
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_full=true

          if [[ "$EVENT_NAME" == "push" ]]; then
            associated_prs="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls")"
            if jq -e 'length > 0' <<<"$associated_prs" >/dev/null; then
              run_full=false
              echo "This main-branch commit belongs to a pull request whose CI ran before merge."
              echo "Skipping the duplicate full test suite on the merge push."
            fi
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  verify:
    name: Verification (shard ${{ matrix.shard }}/3)
    needs: prepare
    if: needs.prepare.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SNOOZER_TEST_LIGHTHOUSE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Start disposable Supabase in the background
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/supabase-start.log"
          exit_file="$RUNNER_TEMP/supabase-start.exit"
          pid_file="$RUNNER_TEMP/supabase-start.pid"
          rm -f "$log" "$exit_file" "$pid_file"

          nohup bash -c '
            set +e
            npx --yes supabase@3.1.0 start --exclude studio,edge-runtime,logflare,vector,supavisor,postgres-meta
            result=$?
            printf "%s\\n" "$result" > "$RUNNER_TEMP/supabase-start.exit"
            exit "$result"
          ' >"$log" 2>&1 </dev/null &

          echo "$!" > "$pid_file"
          echo "Supabase startup is running while independent checks execute."

      - name: Scan source for secrets
        if: matrix.shard == 1
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner --verbose

      - name: Run dependency and policy audit
        if: matrix.shard == 1
        run: npm run audit

      - name: Run ESLint
        if: matrix.shard == 1
        run: npm run lint

      - name: Run TypeScript checks
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Run unit and database tests
        if: matrix.shard == 1
        run: npm test

      - name: Wait for disposable Supabase and load test credentials
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat "$RUNNER_TEMP/supabase-start.pid")"
          exit_file="$RUNNER_TEMP/supabase-start.exit"
          log="$RUNNER_TEMP/supabase-start.log"

          for attempt in $(seq 1 180); do
            [[ -f "$exit_file" ]] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [[ ! -f "$exit_file" ]]; then
            echo "::error::Supabase startup did not finish within six minutes."
            tail -n 80 "$log" || true
            exit 1
          fi

          startup_status="$(cat "$exit_file")"
          if [[ "$startup_status" != "0" ]]; then
            echo "::error::The disposable Supabase stack could not start."
            python3 -c 'import pathlib,re,sys; lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines(); match=[l for l in lines if re.search(r"(?i)sqlstate|error:|failed|migration|permission denied|invalid|timeout",l)]; print("\n".join(re.sub(r"[A-Za-z0-9_.-]{120,}","[REDACTED]",l)[:350] for l in match[-20:]))' "$log"
            exit "$startup_status"
          fi

          eval "$(npx --yes supabase@3.1.0 status -o env)"
          kofi_fixture_token="$(openssl rand -hex 32)"
          stripe_fixture_secret="whsec_$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$kofi_fixture_token" "$stripe_fixture_secret"
          printf '::add-mask::%s\n' "${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          {
            printf 'NEXT_PUBLIC_SITE_URL=http://localhost:3000\n'
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "${PUBLISHABLE_KEY:-$ANON_KEY}"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            printf 'KOFI_WEBHOOK_TOKEN=%s\n' "$kofi_fixture_token"
            printf 'STRIPE_SANDBOX_WEBHOOK_SECRET=%s\n' "$stripe_fixture_secret"
            printf 'SNOOZER_TEST_LOCAL_SUPABASE=1\n'
          } >> "$GITHUB_ENV"

      - name: Restore Next.js build cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # actions/cache v5.0.1
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.shard }}-
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build production application
        run: npm run build

      - name: Install Chromium headless shell
        run: npx playwright install --only-shell chromium

      - name: Run Playwright shard
        run: npm run test:e2e -- --workers=2 --shard=${{ matrix.shard }}/3

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-diagnostics-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: validate
    if: always()
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the combined CI result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUN_FULL: ${{ needs.prepare.outputs.run_full }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREPARE_RESULT" != "success" ]]; then
            echo "::error::CI could not determine whether full validation should run."
            exit 1
          fi
          if [[ "$RUN_FULL" == "false" ]]; then
            echo "Full CI already passed on the pull request. The merge push does not repeat the same suite."
            exit 0
          fi
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "::error::One or more CI verification shards failed or were skipped."
            exit 1
          fi
          echo "All security, static, unit, database, build and browser checks passed."
