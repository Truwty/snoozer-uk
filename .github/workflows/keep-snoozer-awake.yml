name: Keep Snoozer awake

on:
  schedule:
    # Render free web services sleep after inactivity. Ping every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snoozer-keep-awake
  cancel-in-progress: true

jobs:
  wake-service:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Snoozer and verify HTTP response
        env:
          SNOOZER_URL: https://snoozer.uk/
        run: |
          set -euo pipefail
          echo "Pinging ${SNOOZER_URL}"
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\\n" \
            "${SNOOZER_URL}"
