name: Creator sandbox receipt recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
permissions: {}
concurrency:
  group: creator-sandbox-receipt-recovery
  cancel-in-progress: false
jobs:
  reconcile:
    if: vars.CREATOR_SANDBOX_RECOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      STAGING_ORIGIN: ${{ vars.CREATOR_SANDBOX_RECOVERY_ORIGIN }}
      OPERATOR_TOKEN: ${{ secrets.STRIPE_CREATOR_SANDBOX_RECOVERY_TOKEN }}
    steps:
      - name: Retry one bounded receipt batch
        shell: bash
        run: |
          if [[ ! "$STAGING_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ || ${#OPERATOR_TOKEN} -lt 32 ]]; then
            echo "Creator sandbox recovery origin or token is missing or invalid."
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 300 \
            --request POST --header "Authorization: Bearer $OPERATOR_TOKEN" \
            --header 'Content-Type: application/json' --data '{"limit":1}' \
            "$STAGING_ORIGIN/api/v1/commerce/stripe/recover"
