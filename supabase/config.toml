project_id = "snoozer-uk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/reset-password"]
minimum_password_length = 12

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "1s"

[auth.email.template.confirmation]
subject = "Verify your Snoozer email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Snoozer password"
content_path = "./supabase/templates/recovery.html"
